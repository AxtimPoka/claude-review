name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The three gates run as separate steps, and each one runs even if an
      # earlier one failed. `npm run check` chains them with &&, which would
      # hide the test results behind a lint error and cost the author a second
      # round trip to learn about them.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      # Added in the pull request that discovered it was missing. `check:docs`
      # was chained into `npm run check`, and the pull request that added it
      # said CI would therefore run it. It would not: the steps above call the
      # scripts one by one, so a gate reaches CI only when it is listed here.
      # CODEOWNERS already says so, in the paragraph about owning package.json.
      # tests/ci-parity.test.ts now compares the two lists, so the next gate
      # cannot be added to one and forgotten in the other.
      - name: Docs
        if: ${{ !cancelled() }}
        run: npm run check:docs
