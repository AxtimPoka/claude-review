name: AI review

# Runs on every push to an open pull request, not only when it is opened. An
# approval in this pipeline covers one commit; a review of the first commit
# says nothing about the fourth. See PIPELINE.md, Step 3, decision 1.
#
# The cost of that choice is duplicate findings, so the prompt below makes the
# run read the threads it already opened before it opens another one.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Reading the existing threads only prevents a duplicate if the runs are
# ordered. Two pushes in quick succession would otherwise start two runs that
# both read the thread list before either has posted. This queues them per
# pull request. cancel-in-progress would instead throw away the first run's
# findings, which is the opposite of what this job is for.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The PR head, not the merge ref. The action below checks out the PR's
      # head branch itself, and a dirty file only survives that move when the
      # blob is identical in both commits. Measured on this PR's own run: the
      # log shows `git checkout --force refs/remotes/pull/21/merge`, then
      # `Previous HEAD position was b7e171b Merge ...` and `Switched to a new
      # branch`. From the merge commit, a REVIEW.md that main has changed since
      # the branch point has a different blob, so git would quietly restore the
      # branch's stale copy — or refuse the checkout if the file is also dirty.
      # From the head commit, the action's move is between identical trees.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      # REVIEW.md decides what a finding is here: the bug classes, the
      # invariants no test guards, and the Skip list. It is not in the action's
      # SENSITIVE_PATHS, so without this step the job reads the pull request's
      # own copy. A pull request could add src/storage.ts to ## Skip, or delete
      # an invariant, and then be judged by the rules it just wrote.
      #
      # main's copy wins. The proposed copy is still in
      # `git diff origin/main...HEAD`, so the change stays reviewable; it just
      # does not govern this run. Not the same shape as the action's own
      # CLAUDE.md swap: that one runs after its checkout, this one before,
      # which is why the checkout above is pinned to the head sha and why the
      # last step in this job checks that the swap survived.
      #
      # This checkout is shallow, so main is not here yet. The fetch writes
      # refs/remotes/origin/main explicitly: checking out a sha above means
      # actions/checkout no longer creates that ref on its own, and the prompt
      # tells the reviewer to run `git diff origin/main...HEAD`. No --depth,
      # so the clone is not made shallower than it already is. main's copy goes
      # to a temp path first, because `> REVIEW.md` truncates before git can
      # fail.
      - name: Judge against main's REVIEW.md, not the pull request's
        run: |
          if [ ! -f REVIEW.md ]; then
            echo "::error::the pull request has no REVIEW.md"
            exit 1
          fi
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          git show origin/main:REVIEW.md > "$RUNNER_TEMP/REVIEW.main.md"
          mv "$RUNNER_TEMP/REVIEW.main.md" REVIEW.md
          echo "REVIEW.md is now main's copy ($(wc -l < REVIEW.md) lines)"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # The repository's own GITHUB_TOKEN, not the Claude GitHub App. One
          # fewer thing to install, and one fewer thing that can be the reason
          # a run failed. The cost is cosmetic: comments arrive from
          # github-actions[bot] instead of claude[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This job re-runs on every push and starts with no memory of the
            last run. So before you read the diff, list the inline comments
            that are already on this pull request:

                gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate

            Do not open a new thread for a finding that is already there,
            whether or not that thread is resolved. A duplicate thread blocks
            the merge a second time for one reason, and the author has to close
            it by hand. If such a finding still applies after the new commits,
            name it in your summary comment under "Still open" and leave the
            original thread as the place it is discussed.

            Read REVIEW.md and CLAUDE.md before you read the diff. They are
            written by the code owners. Where they disagree with what you
            would check out of habit, they win. REVIEW.md names what failure
            looks like here, how to report, the bug classes this repo has
            already been bitten by, and the invariants no test guards.

            Review the diff only. Do not report a problem that lives outside
            the files this pull request touches, even a real one: the author
            did not cause it, and the round trip costs them time for nothing.
            Repo-level gaps are found by a separate pass over the whole
            repository, which is not this job.

            Rules:

            - Every finding needs a file and a line. No evidence, no finding.
            - Tag each finding Important, Nit, or Pre-existing.
            - At most 3 Nits. More than that means you are reviewing style
              instead of behaviour.
            - Post findings as inline comments. Each one becomes a thread the
              author must resolve before merging. You have no veto here:
              merging is blocked by an unresolved thread, not by your verdict.
            - If a finding is declined rather than fixed, the reason has to end
              up in REVIEW.md or in CLAUDE.md. When you raise something those
              files do not already cover, propose the exact line to add.
            - If nothing is Important, say so in one line. Do not pad the
              review to look thorough.
            - Do not edit, create or delete any file. You are reviewing a diff,
              and a file you changed is no longer the diff the author wrote. If
              you find yourself wanting to try a change, describe it in the
              finding instead. If you notice the checkout already differs from
              the commit under review, say so in your summary and review the
              commit, not the working tree.

          # --allowedTools ADDS to the defaults, it does not replace them.
          # On #7 the reviewer reported that it was still offered Edit and
          # Write and that read-only Bash ran; on earlier runs, on #5, it had
          # reported that `npm` needed approval. Both hold only if the list
          # adds: npm is not in the defaults, cat and git diff are. So the
          # prompt's no-edit rule was a request with nothing behind it.
          #
          # This removes the edit path. It does not make the checkout
          # read-only: Bash can still write, `sed -i` for one.
          #
          # The cause of the CLAUDE.md edit on #5 is now known, and it was not
          # a tool call — which is why the job log showed none. The action
          # replaces a pull request's CLAUDE.md with main's before the run, in
          # its own restore-config.ts, and keeps the pull request's copy under
          # .claude-pr/. Every review round on #17 reported the same
          # uncommitted CLAUDE.md and reviewed the commit instead. PIPELINE.md
          # records the mechanism.
          #
          # So this flag closes an edit path that turned out not to be the one
          # used. It stays, because the prompt's no-edit rule had nothing
          # behind it either way — but it is not the fix for that drift, and a
          # checkout that differs here is expected, not a symptom.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"

      # The step above is prevention. This is detection, in the same shape as
      # security-review.yml's "the scan must have run": if the reviewer was
      # handed the wrong rules, say so loudly instead of posting a review that
      # looks normal.
      #
      # The action checks out the PR's head branch itself, after the swap. That
      # move is safe only while the checkout above stays pinned to the head sha.
      # Anyone who changes that line, or any future version of the action that
      # moves between different trees, silently gets the pull request's own
      # REVIEW.md back — and the swap step's log line would still say it
      # succeeded. That is this repo's bug class #3, in the pipeline itself.
      #
      # No `if:` on purpose. This step is for the case where the review above
      # reported success, which is the only case that reaches it.
      - name: The review must have used main's REVIEW.md
        run: |
          if ! git show origin/main:REVIEW.md | diff -q - REVIEW.md > /dev/null; then
            echo "::error::REVIEW.md is not main's copy; the review was judged by the wrong rules"
            git show origin/main:REVIEW.md | diff - REVIEW.md | head -20
            exit 1
          fi
          echo "the review used main's REVIEW.md"
