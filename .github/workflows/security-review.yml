name: Security review

# A separate pass from the AI review in claude-review.yml. The two ask
# different questions — "does this change do what it says" and "can this
# change be used against someone" — and the second one has no automated
# defence against its own false positives, so it is worth keeping its findings
# apart from the first one's.
#
# It needs no new branch protection rule. The action posts its findings as
# inline review comments, which are resolvable threads, so the branch
# protection setting "Require conversation resolution before merging" already
# blocks the merge while a finding is open.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest

    # One value, read by both the guard below and the action. A guard that
    # hard-codes the path cannot catch a typo in the path it is guarding.
    env:
      SCAN_INSTRUCTIONS: REVIEW.md

    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history: the scan diffs against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The action reads custom-security-scan-instructions as a file path, and
      # silently skips a path that does not exist:
      #
      #   if scan_file and Path(scan_file).exists():
      #       ...  # github_action_audit.py
      #
      # There is no error and no warning. A typo would leave the scan running
      # with no threat model at all, reporting every user-supplied path as a
      # traversal, and the job would still be green. That is REVIEW.md's third
      # failure class — silent failure — in our own pipeline. Fail loudly.
      - name: The scan instructions file must exist
        run: test -f "$SCAN_INSTRUCTIONS"

      # Pinned by commit, not @main. This action has no tags and no releases,
      # so the only moving alternative is a branch that can change under a
      # workflow we hand an API key to. The action pins its own dependencies
      # the same way.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

          # The repo's own review guide, threat model included, is appended to
          # the audit prompt. One source of truth: editing REVIEW.md changes
          # what the scan looks for, with nothing to keep in sync.
          custom-security-scan-instructions: ${{ env.SCAN_INSTRUCTIONS }}

          # false-positive-filtering-instructions is deliberately not set.
          # Phase 1 is for seeing the unfiltered noise. Each finding we declare
          # false earns a line in that file afterwards — that is the point of
          # the exercise, and guessing the lines up front would skip it.

          # The action caches per pull request and skips a re-run by default.
          # On #5 that meant the second push — the one that fixed two silent
          # failures — was never scanned at all: a later commit could add
          # anything and this gate would not see it. A scan that reads only
          # the first commit cannot produce a finding to block the merge on,
          # so it is not a gate.
          #
          # The action warns that re-analysing the same code can repeat a
          # finding. It is right, and it has no equivalent of the AI review's
          # read-the-existing-threads step, so duplicates here are real. The
          # article's written priority settles it: catch real bugs first, cut
          # review rounds second.
          run-every-commit: true

          comment-pr: true
          upload-results: true
