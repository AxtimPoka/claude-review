name: Security review

# A separate pass from the AI review in claude-review.yml. The two ask
# different questions — "does this change do what it says" and "can this
# change be used against someone" — and the second one has no automated
# defence against its own false positives, so it is worth keeping its findings
# apart from the first one's.
#
# It needs no new branch protection rule. The action posts its findings as
# inline review comments, which are resolvable threads, so the branch
# protection setting "Require conversation resolution before merging" already
# blocks the merge while a finding is open.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest

    # One value, read by both the guard below and the action. A guard that
    # hard-codes the path cannot catch a typo in the path it is guarding.
    env:
      SCAN_INSTRUCTIONS: REVIEW.md

    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history: the scan diffs against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # REVIEW.md decides what a finding is here: the bug classes, the
      # invariants no test guards, and the Skip list. This action has no
      # protected-path mechanism at all, so without this step the scan is
      # handed the pull request's own copy as its threat model. A pull request
      # could add src/storage.ts to ## Skip, or delete an invariant, and then
      # be scanned against the rules it just wrote.
      #
      # main's copy wins. The proposed copy is still in
      # `git diff origin/main...HEAD`, so the change stays reviewable; it just
      # does not govern this run.
      #
      # Not the same shape as the CLAUDE.md swap the AI review's action does for
      # itself: that one runs after its own checkout. This action does not
      # check anything out, so a swap before it holds. The guard after the scan
      # is what makes that assumption loud if it ever stops being true.
      #
      # No --depth on the fetch: this checkout is a full clone, and a shallow
      # fetch would turn it into a shallow one, which the scan's diff against
      # the base commit needs. Written to a temp path first, because
      # `> REVIEW.md` truncates before git can fail.
      - name: Judge against main's REVIEW.md, not the pull request's
        run: |
          if [ ! -f REVIEW.md ]; then
            echo "::error::the pull request has no REVIEW.md"
            exit 1
          fi
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          git show origin/main:REVIEW.md > "$RUNNER_TEMP/REVIEW.main.md"
          mv "$RUNNER_TEMP/REVIEW.main.md" REVIEW.md
          echo "REVIEW.md is now main's copy ($(wc -l < REVIEW.md) lines)"

      # The action reads custom-security-scan-instructions as a file path, and
      # silently skips a path that does not exist:
      #
      #   if scan_file and Path(scan_file).exists():
      #       ...  # github_action_audit.py
      #
      # There is no error and no warning. A typo would leave the scan running
      # with no threat model at all, reporting every user-supplied path as a
      # traversal, and the job would still be green. That is REVIEW.md's third
      # failure class — silent failure — in our own pipeline. Fail loudly.
      - name: The scan instructions file must exist
        run: test -f "$SCAN_INSTRUCTIONS"

      # The guard below reads a file at the repo root, and the repo root is the
      # PR's checkout — so the PR could ship that file itself. The action copies
      # its own results over it on most paths, but not all: it exits 0 before
      # the copy when the event is not a pull_request, and again on the cache
      # skip that `run-every-commit: true` currently turns off. Either one is a
      # one-line change away. A committed {"findings": []} would then satisfy
      # every check below and the scan would be green having never run, which is
      # the failure this whole file exists to stop.
      - name: No results file before the scan
        run: rm -f claudecode-results.json

      # Pinned by commit, not @main. This action has no tags and no releases,
      # so the only moving alternative is a branch that can change under a
      # workflow we hand an API key to. The action pins its own dependencies
      # the same way.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

          # The repo's own review guide, threat model included, is appended to
          # the audit prompt. One source of truth: editing REVIEW.md changes
          # what the scan looks for, with nothing to keep in sync.
          custom-security-scan-instructions: ${{ env.SCAN_INSTRUCTIONS }}

          # false-positive-filtering-instructions is deliberately not set.
          # Phase 1 is for seeing the unfiltered noise. Each finding we declare
          # false earns a line in that file afterwards — that is the point of
          # the exercise, and guessing the lines up front would skip it.

          # The action caches per pull request and skips a re-run by default.
          # On #5 that meant the second push — the one that fixed two silent
          # failures — was never scanned at all: a later commit could add
          # anything and this gate would not see it. A scan that reads only
          # the first commit cannot produce a finding to block the merge on,
          # so it is not a gate.
          #
          # The action warns that re-analysing the same code can repeat a
          # finding. It is right, and it has no equivalent of the AI review's
          # read-the-existing-threads step, so duplicates here are real.
          #
          # What settles it is the priority the article writes down: catch real
          # bugs first, cut review rounds second. Repeated findings cost
          # rounds; an unscanned commit costs a bug.
          # https://claude.dev/blog/solving-code-review-at-anthropic/
          run-every-commit: true

          comment-pr: true
          upload-results: true

      # The action downgrades its own failures to warnings. Measured on #14 with
      # a key that was present but invalid: the scan did not run, the step and
      # the job both reported `success`, and the action's own annotation said
      # `ClaudeCode exited with code 1`. So `security` being a required check
      # does not mean the scan happened.
      #
      # `findings-count` cannot tell the two apart either — the action's own
      # source writes `findings_count=0` on the error path, which is the number
      # a clean scan gives. The results file can: it carries `.error` when the
      # scan failed, and a `findings` array when it ran. The action copies it to
      # the workspace root on most paths — but not all, which is why the step
      # before the scan clears that path first. So a missing file here is a real
      # outcome, not an impossible one, and it is treated as a failure.
      #
      # No `if:` here on purpose. This step exists for the case where the step
      # above reported success, which is the only case that reaches it.
      - name: The scan must have run, not just reported success
        env:
          RESULTS: ${{ github.workspace }}/claudecode-results.json
        run: |
          if [ ! -f "$RESULTS" ]; then
            echo "::error::the security scan produced no results file"
            exit 1
          fi
          if jq -e '.error' "$RESULTS" > /dev/null 2>&1; then
            echo "::error::the security scan did not run: $(jq -r '.error' "$RESULTS")"
            exit 1
          fi
          if ! jq -e '.findings | type == "array"' "$RESULTS" > /dev/null 2>&1; then
            echo "::error::the results file has no findings array; the scan did not complete"
            exit 1
          fi
          echo "the scan ran. findings: $(jq -r '.findings | length' "$RESULTS")"

      # Detection, not prevention. This action does not check anything out
      # today, so the swap before it holds — but that is an assumption about
      # someone else's code, pinned by commit and reread only when the pin
      # moves. If a future version does its own checkout, the scan would be
      # handed the pull request's own threat model and still report success.
      # The swap step's log line would still say it worked.
      - name: The scan must have used main's REVIEW.md
        run: |
          if ! git show origin/main:REVIEW.md | diff -q - "$SCAN_INSTRUCTIONS" > /dev/null; then
            echo "::error::$SCAN_INSTRUCTIONS is not main's copy; the scan used the wrong threat model"
            git show origin/main:REVIEW.md | diff - "$SCAN_INSTRUCTIONS" | head -20
            exit 1
          fi
          echo "the scan used main's REVIEW.md"
